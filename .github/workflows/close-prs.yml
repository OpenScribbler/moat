name: Auto-close PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Skip authors with write access. author_association is not a
            // usable signal: GITHUB_TOKEN sees private org members as
            // CONTRIBUTOR, which closed the maintainer's own PRs. The
            // collaborator permission endpoint reports the real access level.
            const login = context.payload.pull_request.user.login;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: login,
            });

            if (['admin', 'write'].includes(perm.permission)) {
              core.info(`Skipping auto-close: @${login} has ${perm.permission} access`);
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed',
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: 'This repository does not accept pull requests. Please open an issue to discuss proposed changes to the MOAT specification.',
            });
