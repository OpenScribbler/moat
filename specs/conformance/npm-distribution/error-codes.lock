# npm-distribution error-code stability lock.
#
# ADR-0015 establishes the stability contract for `NPM-<SECTION>-<NN>(-<X>)?`
# error codes: once a code is in the §Conformance (normative) table of
# specs/npm-distribution.md, its spelling MUST NOT change and its meaning
# MUST NOT be repurposed. Obsoleted codes MUST be retained as
# `Reserved (was: <description>)` rows rather than reused or removed.
#
# This file makes that contract programmatic. Every line below names a
# code that the spec has committed to. The slice-8 conformance script
# (A10) verifies that every code listed here still appears in the table
# (either as a live row or as `Reserved (was: ...)`). New codes added to
# the table are allowed without a lock entry; removals and renames are
# blocked.
#
# Maintenance:
# - When a new code is introduced and the spec is cut to a release tag,
#   append the code to this file in the same PR that bumps the version.
# - Never remove a line. To obsolete a code, change its row in the table
#   to `Reserved (was: <prior description>)` and leave the lock entry.
# - Comment lines (starting with `#`) and blank lines are ignored by the
#   lint.

